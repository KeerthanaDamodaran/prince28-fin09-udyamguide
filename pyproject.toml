[project]
name = "udyamguide"
version = "0.1.0"
description = "UdyamGuide – An AI-powered assistant that answers MSME queries using verified government documents and calculates delayed payment interest."
readme = "README.md"
authors = [
    { name = "Keerthana", email = "keerthanadamodaran026@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]



[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
